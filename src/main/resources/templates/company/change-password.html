<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GiftNova — Change Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body class="admin-page">

<nav class="navbar">
    <div class="container nav-inner">
        <a href="/" class="logo">Gift<span>Nova</span></a>
        <div class="nav-links">
            <span class="admin-company" th:text="${company.name}"></span>
            <a th:href="@{/admin/{id}/policies(id=${company.id})}"      class="admin-tab">Policy Rules</a>
            <a th:href="@{/companies/{id}/employees(id=${company.id})}" class="admin-tab">Employees</a>
            <a th:href="@{/companies/{id}/events(id=${company.id})}"    class="admin-tab">Upcoming Events</a>
            <a th:href="@{/companies/{id}/approvals(id=${company.id})}" class="admin-tab">Approvals</a>
            <a th:href="@{/companies/{id}/analytics(id=${company.id})}" class="admin-tab">Analytics</a>
            <a th:href="@{/admin/{id}/audit(id=${company.id})}"         class="admin-tab">Audit Log</a>
            <div class="profile-wrap">
                <button class="profile-trigger" onclick="toggleProfileMenu(this)">Profile ▾</button>
                <div class="profile-menu">
                    <div class="profile-info">
                        <div class="profile-info-name" th:text="${company.name}"></div>
                        <div class="profile-info-website" th:text="${company.website}"></div>
                    </div>
                    <a th:href="@{/companies/{id}/change-password(id=${company.id})}" class="profile-item">Change Password</a>
                    <form th:action="@{/companies/{id}/delete(id=${company.id})}" method="post">
                        <input type="hidden" name="confirmPassword"/>
                        <button type="button" class="profile-item profile-item-danger"
                                onclick="confirmDelete(this.closest('form'))">Remove Account</button>
                    </form>
                    <a href="/logout" class="profile-item profile-item-logout">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="admin-layout container">
    <div class="admin-header">
        <div>
            <div class="section-label">Profile</div>
            <h1>Change Password</h1>
        </div>
        <a th:href="@{/companies/{id}/events(id=${company.id})}" class="btn btn-outline">← Back</a>
    </div>

    <div class="alert-error"   th:if="${error}" th:text="${error}"></div>
    <div class="alert-success" th:if="${toast}" th:text="${toast}"></div>

    <div class="admin-card change-pw-card">
        <form th:action="@{/companies/{id}/change-password(id=${company.id})}" method="post"
              style="padding: 28px; display:flex; flex-direction:column; gap:20px;">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" required/>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" minlength="6" required/>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update Password</button>
                <a th:href="@{/companies/{id}/events(id=${company.id})}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
function toggleProfileMenu(btn) {
    const menu = btn.nextElementSibling;
    menu.classList.toggle('open');
    document.addEventListener('click', function close(e) {
        if (!btn.parentElement.contains(e.target)) {
            menu.classList.remove('open');
            document.removeEventListener('click', close);
        }
    });
}
function confirmDelete(form) {
    const pw = prompt('Enter your password to confirm account deletion:');
    if (pw === null || pw.trim() === '') return;
    form.querySelector('[name=confirmPassword]').value = pw;
    form.submit();
}
</script>
</body>
</html>
